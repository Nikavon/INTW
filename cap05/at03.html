<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AT03 - Matrícula Acadêmica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #D5E7B5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #6E1A37;
            border-bottom: 2px solid #AE2448;
            padding-bottom: 10px;
        }
        .obrigatorio-nota {
            background-color: #fcf8e8;
            border-left: 4px solid #AE2448;
            padding: 8px 12px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #6E1A37;
        }
        fieldset {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 25px;
        }
        legend {
            font-weight: bold;
            font-size: 1.1em;
            color: #6E1A37;
            padding: 0 8px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #6E1A37;
        }
        .label-obrigatorio::after {
            content: " *";
            color: #d9534f;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input[type="radio"], input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }
        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 5px;
        }
        .radio-group label, .checkbox-group label {
            display: inline-flex;
            align-items: center;
            font-weight: normal;
            gap: 4px;
        }
        .subfieldset {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .subfieldset legend {
            font-size: 1em;
            font-weight: bold;
            color: #6E1A37;
        }
        button {
            background-color: #6E1A37;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #AE2448;
        }
        .button-group {
            margin-top: 20px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #AE2448;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        small {
            display: block;
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solicitação de Matrícula</h1>
        <div class="obrigatorio-nota">
            * Campos obrigatórios
        </div>
        <form action="https://httpbin.org/post" method="post">

            <fieldset>
                <legend>Dados Pessoais</legend>
                <div class="campo">
                    <label class="label-obrigatorio" for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required minlength="5" maxlength="100">
                </div>
                <div class="campo">
                    <label class="label-obrigatorio" for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" title="CPF no formato 000.000.000-00">
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(82) 99999-9999" title="Formato: (DD) 99999-9999 ou (DD) 9999-9999">
                </div>
                <div class="campo">
                    <label class="label-obrigatorio" for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Dados Acadêmicos</legend>
                <div class="campo">
                    <label class="label-obrigatorio" for="curso">Curso pretendido</label>
                    <select id="curso" name="curso" required>
                        <option value="">Selecione um curso</option>
                        <optgroup label="Computação">
                            <option value="Sistemas de Informação">Sistemas de Informação</option>
                            <option value="Ciência da Computação">Ciência da Computação</option>
                            <option value="Engenharia da Computação">Engenharia da Computação</option>
                        </optgroup>
                        <optgroup label="Gestão">
                            <option value="Administração">Administração</option>
                            <option value="Ciências Contábeis">Ciências Contábeis</option>
                        </optgroup>
                    </select>
                </div>
                <div class="subfieldset">
                    <legend>Período pretendido</legend>
                    <div class="radio-group">
                        <label><input type="radio" name="periodo" value="Manhã" required> Manhã</label>
                        <label><input type="radio" name="periodo" value="Tarde"> Tarde</label>
                        <label><input type="radio" name="periodo" value="Noite"> Noite</label>
                    </div>
                </div>
                <div class="campo">
                    <label class="label-obrigatorio" for="ano_ingresso">Ano de ingresso pretendido</label>
                    <input type="number" id="ano_ingresso" name="ano_ingresso" min="2025" max="2030" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Áreas de Interesse</legend>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="interesses" value="Desenvolvimento Web"> Desenvolvimento Web</label>
                    <label><input type="checkbox" name="interesses" value="Banco de Dados"> Banco de Dados</label>
                    <label><input type="checkbox" name="interesses" value="Inteligência Artificial"> Inteligência Artificial</label>
                    <label><input type="checkbox" name="interesses" value="Segurança da Informação"> Segurança da Informação</label>
                    <label><input type="checkbox" name="interesses" value="Infraestrutura"> Infraestrutura</label>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="submit">Solicitar matrícula</button>
                <button type="reset">Limpar formulário</button>
            </div>
        </form>
        <a href="../index.html">← Voltar para o currículo</a>
    </div>
</body>
<script>
(function() {
    const cpfInput = document.getElementById('cpf');
    const telefoneInput = document.getElementById('telefone');

    function formatarCPF(valor) {
        let numeros = valor.replace(/\D/g, '');
        if (numeros.length <= 3) return numeros;
        if (numeros.length <= 6) return numeros.replace(/^(\d{3})(\d{1,3})/, '$1.$2');
        if (numeros.length <= 9) return numeros.replace(/^(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
        return numeros.replace(/^(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
    }

    function formatarTelefone(valor) {
        let numeros = valor.replace(/\D/g, '');
        if (numeros.length === 0) return '';
        if (numeros.length <= 2) return `(${numeros}`;
        if (numeros.length <= 6) return numeros.replace(/^(\d{2})(\d{1,4})/, '($1) $2');
        if (numeros.length <= 10) return numeros.replace(/^(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
        return numeros.replace(/^(\d{2})(\d{5})(\d{1,4})/, '($1) $2-$3');
    }

    function aplicarMascara(input, formatador) {
        let start = input.selectionStart;
        let end = input.selectionEnd;
        let rawValue = input.value;
        let formatted = formatador(rawValue);
        input.value = formatted;

        let diff = formatted.length - rawValue.length;
        let novoStart = start + diff;
        let novoEnd = end + diff;

        if (novoStart >= 0 && novoStart <= formatted.length) {
            input.setSelectionRange(novoStart, novoEnd);
        } else {
            input.setSelectionRange(formatted.length, formatted.length);
        }
    }

    if (cpfInput) {
        cpfInput.addEventListener('input', function(e) {
            aplicarMascara(cpfInput, formatarCPF);
        });
    }

    if (telefoneInput) {
        telefoneInput.addEventListener('input', function(e) {
            aplicarMascara(telefoneInput, formatarTelefone);
        });
    }
})();
</script>
</html>
